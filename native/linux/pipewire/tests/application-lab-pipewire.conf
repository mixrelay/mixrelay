# Dedicated test daemon: no ALSA, Bluetooth, portal, JACK, or hardware factories.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    default.clock.rate = 48000
    default.clock.quantum = 128
    default.clock.min-quantum = 128
    default.clock.max-quantum = 2048
}
context.properties.rules = [
    { matches = [ { cpu.vm.name = !null } ]
        actions = { update-props = {
            # PipeWire 1.4's installed daemon uses this floor inside a VM.
            # DSP slices remain 128 frames; native scheduling belongs to PipeWire.
            default.clock.min-quantum = 1024
        } }
    }
]
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    # Match the distribution's audio-thread scheduling negotiation. This does
    # not grant privileges: RTKit/rlimits still decide whether RT is permitted.
    { name = libpipewire-module-rt
        args = { nice.level = -11 rt.prio = 88 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = MixRelay-Lab-Dummy-Driver
        node.group = pipewire.dummy
        priority.driver = 20000
    } }
]
