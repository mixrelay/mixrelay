# Private daemon only. No hardware factories or session defaults are touched.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    default.clock.rate = 48000
    default.clock.quantum = @QUANTUM@
    default.clock.min-quantum = @QUANTUM@
    default.clock.max-quantum = @QUANTUM@
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    @RT_MODULE@
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
    { name = libpipewire-module-rtp-source args = {
        source.ip = 127.0.0.1
        source.port = @PORT@
        sess.latency.msec = 250
        sess.ignore-ssrc = true
        audio.format = S16BE
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        stream.props = {
            node.name = io.mixrelay.lab-drift-rtp
            node.description = "Independent RTP sample clock fixture"
            media.class = Audio/Source
            node.always-process = true
            node.pause-on-idle = false
            resample.disable = @DISABLE@
        }
    } }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = MixRelay-Drift-Lab-Monotonic-Driver
        node.group = pipewire.dummy
        priority.driver = 20000
    } }
]
