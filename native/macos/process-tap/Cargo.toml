[package]
name = "tonenari-process-tap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true

[dependencies]
# Typed capture failures retain their native status at the C boundary.
thiserror.workspace = true
# Share transport/clock primitives without making HAL/engine depend on AppKit.
tonenari-macos-transport = { path = "../common" }

[build-dependencies]
# Only Objective-C object construction and AppKit adapters require this compiler.
cc = "1.2"

[dev-dependencies]
# Verify callback allocation behavior; never linked into production.
allocation-counter = "0.8.1"
