[package]
name = "mixrelay-macos-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Reuse the common native-format and independent Driver control contracts.
mixrelay-audio-io = { path = "../../../crates/audio-io" }
mixrelay-driver-control = { path = "../../../crates/driver-control" }
# Existing bounded PCM transport and inventory codec; no engine dependency.
mixrelay-macos-transport = { path = "../common" }
# Non-real-time inventory/listener ownership and concrete startup errors.
parking_lot.workspace = true
thiserror.workspace = true
# Authenticate the HAL's _coreaudiod peer via the OS account database.
libc = "0.2"

[build-dependencies]
# Compile only the SDK's nested XPC Blocks adapter.
cc = "1.2"
