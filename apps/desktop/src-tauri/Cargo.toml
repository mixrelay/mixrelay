[package]
name = "tonenari-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
cc = "1.2.57"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon"] }
tokio.workspace = true
tracing = "0.1.41"
tonenari-audio-io = { path = "../../../crates/audio-io" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
tonenari-macos-transport = { path = "../../../native/macos/common" }
tonenari-audio-graph = { path = "../../../crates/audio-graph" }
tonenari-control-protocol = { path = "../../../crates/control-protocol" }
