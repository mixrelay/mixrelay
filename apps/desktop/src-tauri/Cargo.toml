[package]
name = "mixrelay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
cc = "1.2.57"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
mixrelay-control-protocol = { path = "../../../crates/control-protocol" }
mixrelay-driver-control = { path = "../../../crates/driver-control" }
mixrelay-engine-process = { path = "../../../crates/engine-process" }
mixrelay-licensing = { path = "../../../crates/licensing" }
# Native credential stores; no plaintext license-file fallback.
open = "5.4.4"
secrecy = { version = "0.10.3", features = ["serde"] }
sha2 = "0.10.9"
reqwest = { workspace = true, features = ["query", "rustls"] }
mixrelay-local-socket = { path = "../../../crates/local-socket" }
# Numeric ordering of canonical stable release versions.
semver = "1.0.28"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.0"
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tracing = "0.1.41"
# Linux: O_PATH keeps socket inode identity during listener cleanup. All: live-PID checks.
libc = "0.2.186"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt"] }
# Same-directory atomic replacement and cleanup for desktop recording preferences.
tempfile = "3.27.0"
mixrelay-audio-io = { path = "../../../crates/audio-io" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Typed AppKit termination hook; the existing Tauri delegate remains the owner.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSObjCRuntime"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebViewConfiguration", "WKPreferences"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
mixrelay-realtime = { path = "../../../crates/realtime" }
mixrelay-macos-transport = { path = "../../../native/macos/common" }
mixrelay-process-tap = { path = "../../../native/macos/process-tap" }
mixrelay-audio-graph = { path = "../../../crates/audio-graph" }


[dev-dependencies]
# Virtual time exercises delayed native shutdown without sleeping in tests.
tokio = { workspace = true, features = ["test-util"] }
mixrelay-test-support = { path = "../../../crates/test-support" }

[features]
# Embeds the built editor UI instead of the dev server. Release builds enable it
# through the combined cargo build (`--features mixrelay-desktop/custom-protocol`).
custom-protocol = ["tauri/custom-protocol"]
