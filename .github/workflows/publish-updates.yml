name: Publish update catalog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-updates-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Find manifests in the published source release
        id: manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == mixrelay/mixrelay ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' <<<"$release" >/dev/null
          products=()
          for product in mix-relay; do
            manifest="$product.release.json"
            if jq -e --arg name "$manifest" 'any(.assets[]; .name == $name)' <<<"$release" >/dev/null; then
              products+=("$product")
            fi
          done
          if [[ "${#products[@]}" == 0 ]]; then
            echo '::notice::No product release manifests attached; no update catalog publication requested.'
          fi
          echo "products=${products[*]}" >> "$GITHUB_OUTPUT"

      - name: Verify final bytes against successful native qualification
        if: steps.manifests.outputs.products != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.pkg' --pattern '*.deb' --pattern '*.pkg.tar.zst' --pattern '*.streamDeckPlugin' --pattern 'mix-relay.*.json'
          node scripts/qualification-ci.mjs verify-published --directory release-assets --tag "$RELEASE_TAG" --output qualification-proof

      - name: Request central catalog publication
        if: steps.manifests.outputs.products != ''
        env:
          GH_TOKEN: ${{ secrets.APP_SERVER_DISPATCH_TOKEN }}
          PRODUCTS: ${{ steps.manifests.outputs.products }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Missing secret: APP_SERVER_DISPATCH_TOKEN (contents:write access to echovisionlab/appserver).' >&2
            exit 1
          fi
          read -r -a products <<<"${PRODUCTS:?PRODUCTS is required}"
          for product in "${products[@]}"; do
            jq -n --arg product "$product" --arg repository "$GITHUB_REPOSITORY" \
              --arg tag "$RELEASE_TAG" --arg manifest "$product.release.json" \
              '{event_type:"product-release-published",client_payload:{product:$product,source_repository:$repository,release_tag:$tag,release_manifest:$manifest}}' |
              gh api --method POST repos/echovisionlab/appserver/dispatches --input -
          done
