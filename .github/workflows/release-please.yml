name: Release PR and draft release

on:
  push:
    branches: [main]

permissions: {}

# A newer push replaces a pending run; release-please rereads main and merged release PRs each time.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'mixrelay/mixrelay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # Opens or updates the release PR. After it merges, tags the merge commit and creates a
      # draft release (release-please-config.json); publication waits for installed qualification.
      # Without RELEASE_PLEASE_TOKEN, GitHub runs no workflows for the release PR or its commits.
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  product-version:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: Accept only the release-please branch
        run: '[[ "$RELEASE_BRANCH" =~ ^release-please--[A-Za-z0-9._/-]+$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      # release-please writes only its manifest. The project tool sets every versioned file,
      # including Cargo.lock, and commits only when something changed.
      - name: Set the release version in every product manifest
        run: |
          set -euo pipefail
          version="$(jq -er '.["."]' .release-please-manifest.json)"
          node scripts/product-version.mjs set "$version"
          if git diff --quiet; then
            echo "Release branch already carries MixRelay $version"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --quiet --message "chore: set product version to $version"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
