name: Require installed qualification evidence

on:
  pull_request:

permissions: {}

jobs:
  require-installed-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Keep installed qualification visible for every PR head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION/status?per_page=100" \
            --jq 'any(.statuses[]; .context == "Installed candidate / full support contract")')
          if [[ "$existing" == false ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_REVISION" \
              -f state=pending -f context='Installed candidate / full support contract' \
              -f description='A complete installed qualification run is required for this commit' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/candidate-e2e.yml"
          fi
