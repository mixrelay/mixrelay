name: Native build and unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Release qualification needs a successful main run for the exact candidate commit, so main
# runs are never cancelled. Each gets its own group: a shared group without cancel-in-progress
# still replaces an older pending run. Other refs keep only their latest run.
concurrency:
  group: native-lab-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  support:
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.matrix.outputs.macos }}
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: node scripts/support-contract.mjs check
      - name: Install archive inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: node --test scripts/support-contract.test.mjs scripts/polar-configuration.test.mjs scripts/installer-configuration.test.mjs scripts/qualification.test.mjs scripts/e2e/*.test.mjs scripts/prepare-release-manifest.test.mjs scripts/prepare-compiler-cache.test.mjs
      - name: Verify Linux D-Bus symbol isolation with the native ELF loader
        run: node --test scripts/ci/linux-dbus-link.test.mjs
      - id: matrix
        run: node scripts/support-contract.mjs matrix >> "$GITHUB_OUTPUT"

  native:
    needs: support
    name: ${{ matrix.id }} build and unit tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # sccache keeps compiled crates in the GitHub Actions cache between runs. Incremental
    # compilation is off so workspace crates are cacheable too.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      MIXRELAY_CI_TARGET: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Toolchain
        run: |
          npm install --global pnpm@11.9.0
          # The HAL bundle is universal: check:native also builds the Intel slice.
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default 1.96.0
      - name: Select working remote or local compiler cache
        run: node scripts/prepare-compiler-cache.mjs
      - name: Verify hosted OS and CPU
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MAJOR: ${{ matrix.version }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; assert.equal(process.arch, process.env.EXPECTED_ARCH); assert.equal(execFileSync("sw_vers", ["-productVersion"], {encoding:"utf8"}).trim().split(".")[0], process.env.EXPECTED_MAJOR);'
      - run: pnpm install --frozen-lockfile
      # Pre-flight for the lab tooling itself; lab:test then runs the full macOS plan,
      # including `pnpm test:scripts` and `pnpm probe:macos-roundtrip --self-test`.
      - run: node --test scripts/lab/native-check.test.mjs scripts/lab/vm.test.mjs scripts/lab/guest-scripts.test.mjs scripts/lab/pipewire-cli.test.mjs
      - run: pnpm lab:test
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Collect scope and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: native-${{ matrix.id }}
          path: .lab/reports/
          include-hidden-files: true
          if-no-files-found: warn

  linux:
    needs: support
    name: ${{ matrix.id }} build and unit tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.linux) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Hosted runners ship toolchains this job never uses; the workspace build needs the space.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - run: docker compose -f infra/lab/compose.yaml build ${{ matrix.distro }}
      # Full debug info for the whole workspace fills the hosted runner's disk; line tables
      # keep file:line in panics and backtraces.
      - name: Check the contract's native Linux CPU and distro
        env:
          CI_TARGET: ${{ matrix.id }}
        run: docker compose -f infra/lab/compose.yaml run --name mixrelay-ci-check -e MIXRELAY_CI_TARGET="$CI_TARGET" -e MIXRELAY_SOURCE_REVISION="$GITHUB_SHA" -e CARGO_PROFILE_DEV_DEBUG=line-tables-only ${{ matrix.distro }} test
      - name: Collect evidence even when a compile or test fails
        if: always()
        run: |
          mkdir -p .lab/reports
          if docker container inspect mixrelay-ci-check >/dev/null 2>&1; then
            docker cp mixrelay-ci-check:/workspace/.lab/reports/. .lab/reports/
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: linux-${{ matrix.id }}
          path: .lab/reports/
          include-hidden-files: true
          if-no-files-found: warn

  streamdeck:
    name: Stream Deck build, regression tests and distributable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/streamdeck-artifact.mjs build --output streamdeck-package
      - run: pnpm --filter @mixrelay/streamdeck-plugin test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: streamdeck-package
          path: streamdeck-package/*.streamDeckPlugin
          if-no-files-found: error
