name: tonenari-lab
x-build: &build
  context: ../..
  dockerfile: infra/lab/Dockerfile
x-runtime: &runtime
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  debian:
    <<: *runtime
    build:
      <<: *build
      args:
        DISTRO_IMAGE: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
  ubuntu:
    <<: *runtime
    build:
      <<: *build
      args:
        DISTRO_IMAGE: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
  kali:
    <<: *runtime
    build:
      <<: *build
      args:
        DISTRO_IMAGE: kalilinux/kali-rolling@sha256:c6d78f57ebfdd9fec428a8b04f74876e66fddd08dfd328c076224a552e7332a3
  arch:
    <<: *runtime
    # Official Arch is x86_64, not Arch Linux ARM. Apple Silicon executes this
    # container under emulation; its timings must not be treated as latency data.
    platform: linux/amd64
    build:
      <<: *build
      args:
        DISTRO_IMAGE: archlinux:base@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
