[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/audio-engine",
  "crates/control-protocol",
  "crates/control-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["ToneNari"]
repository = "https://github.com/tonenari/tonenari"

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5.3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
